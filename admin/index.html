<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>HP管理</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <script src="../theme.js?v=20260905-theme"></script>
  <!-- プレビューを本番と同じ見た目にするためサイトのCSSを読む（管理画面は adm- 接頭辞で分離） -->
  <link rel="stylesheet" href="../style.css?v=20260905-theme">
  <style>
    html { font-size: 14px; }
    body { padding: 0; margin: 0; background: var(--bg); color: var(--ink); }
    .adm { display: grid; grid-template-columns: 200px 1fr; min-height: 100vh; }
    .adm-side { border-right: 1px solid var(--rule); padding: 20px 0; position: sticky; top: 0; height: 100vh; }
    .adm-brand { padding: 0 20px 16px; font-size: 13px; letter-spacing: .12em; }
    .adm-brand small { display: block; color: var(--muted); letter-spacing: 0; }
    .adm-nav button { display: block; width: 100%; text-align: left; padding: 9px 20px; border: 0; background: none; color: var(--ink); font: inherit; cursor: pointer; }
    .adm-nav button:hover { background: var(--rule); }
    .adm-nav button[aria-current="page"] { font-weight: 700; box-shadow: inset 3px 0 0 var(--ink); }
    .adm-nav button:disabled { color: var(--muted); cursor: default; background: none; }
    .adm-nav .soon { font-size: 10px; margin-left: 6px; }
    .adm-main { padding: 28px 32px 80px; max-width: 980px; min-width: 0; }
    .adm-main h2 { font-size: 18px; font-weight: 400; margin: 0 0 4px; }
    .adm-lead { color: var(--muted); margin: 0 0 24px; }
    .adm-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 20px; }
    .adm-btn { font: inherit; padding: 7px 14px; border: 1px solid var(--ink); background: transparent; color: var(--ink); cursor: pointer; border-radius: 3px; }
    .adm-btn:hover { background: var(--rule); }
    .adm-btn.primary { background: var(--ink); color: var(--bg); }
    .adm-btn.primary:hover { opacity: .85; }
    .adm-btn.small { padding: 3px 9px; font-size: 12px; }
    .adm-btn:disabled { opacity: .4; cursor: default; }
    .adm-status { font-size: 12px; color: var(--muted); }
    .adm-status.err { color: #c0392b; }
    .adm-status.ok { color: #2e7d4f; }
    :root[data-theme="dark"] .adm-status.err { color: #ffb4ad; }
    :root[data-theme="dark"] .adm-status.ok { color: #9fd8b4; }
    .adm-h3 { font-size: 11px; letter-spacing: .14em; color: var(--muted); margin: 28px 0 10px; text-transform: uppercase; }
    .adm-card { display: grid; grid-template-columns: 160px 1fr auto; gap: 16px; padding: 14px; border: 1px solid var(--rule); border-radius: 4px; margin-bottom: 10px; }
    .adm-card.dirty { border-color: var(--ink); }
    .adm-thumb { aspect-ratio: 4/3; background: var(--rule); overflow: hidden; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 11px; }
    .adm-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .adm-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; min-width: 0; }
    .adm-fields label { display: flex; flex-direction: column; font-size: 11px; color: var(--muted); gap: 2px; min-width: 0; }
    .adm-fields label.wide { grid-column: 1 / -1; }
    .adm-fields input { font: inherit; font-size: 13px; color: var(--ink); background: transparent; border: 1px solid var(--rule); border-radius: 3px; padding: 5px 7px; min-width: 0; }
    .adm-fields input:focus { outline: none; border-color: var(--ink); }
    .adm-img-row { display: flex; gap: 6px; }
    .adm-img-row input { flex: 1; min-width: 0; }
    .adm-ops { display: flex; flex-direction: column; gap: 6px; }
    .adm-sum-meta { font-size: 11px; color: var(--muted); letter-spacing: .06em; }
    .adm-sum-title { font-size: 15px; line-height: 1.5; }
    .adm-sum-en { font-size: 12px; color: var(--muted); }
    .adm-detail { margin-top: 12px; }
    .adm-detail summary { cursor: pointer; font-size: 12px; color: var(--muted); }
    .adm-detail[open] summary { margin-bottom: 10px; }
    .adm-dialog { width: min(720px, calc(100vw - 32px)); max-height: calc(100vh - 48px); padding: 0; border: 1px solid var(--rule); border-radius: 6px; background: var(--bg); color: var(--ink); display: flex; flex-direction: column; }
    .adm-dialog:not([open]) { display: none; }
    .adm-dialog::backdrop { background: rgba(0,0,0,.45); }
    .adm-dialog-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px 0; }
    .adm-dialog-tools { display: flex; gap: 12px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--rule); }
    .adm-dialog-tools input[type=search] { flex: 1; min-width: 0; font: inherit; color: var(--ink); background: transparent; border: 1px solid var(--rule); border-radius: 3px; padding: 6px 9px; }
    .adm-check { display: flex; gap: 5px; align-items: center; font-size: 12px; color: var(--muted); white-space: nowrap; }
    .adm-pick-list { overflow-y: auto; padding: 4px 16px 16px; }
    .adm-pick-year { font-size: 12px; font-weight: 700; margin: 14px 0 6px; }
    .adm-pick-item { display: flex; gap: 12px; align-items: center; width: 100%; text-align: left; padding: 6px; border: 1px solid transparent; border-radius: 4px; background: none; color: var(--ink); font: inherit; cursor: pointer; }
    .adm-pick-item:hover, .adm-pick-item:focus-visible { border-color: var(--ink); outline: none; }
    .adm-pick-item.used { opacity: .55; }
    .adm-pick-thumb { flex: none; width: 72px; aspect-ratio: 4/3; background: var(--rule); display: flex; align-items: center; justify-content: center; font-size: 10px; color: var(--muted); overflow: hidden; border-radius: 2px; }
    .adm-pick-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .adm-pick-text { display: flex; flex-direction: column; min-width: 0; flex: 1; }
    .adm-pick-meta { font-size: 11px; color: var(--muted); }
    .adm-pick-title { font-size: 13px; line-height: 1.5; }
    .adm-search { font: inherit; color: var(--ink); background: transparent; border: 1px solid var(--rule); border-radius: 3px; padding: 6px 9px; width: min(360px, 100%); }
    .adm-year { margin-bottom: 18px; }
    .adm-year-head { display: flex; gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--rule); position: sticky; top: 0; background: var(--bg); z-index: 1; }
    .adm-year-head strong { font-size: 16px; }
    .adm-tl-item { display: grid; grid-template-columns: 56px 44px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 6px 4px; border-bottom: 1px dashed var(--rule); }
    .adm-tl-item .adm-pick-thumb { width: 56px; }
    .adm-tl-item.changed { box-shadow: inset 3px 0 0 var(--ink); }
    .adm-tl-month { font-size: 12px; color: var(--muted); }
    .adm-tl-text { font-size: 13px; line-height: 1.6; }
    .adm-tl-ops { display: flex; gap: 4px; }
    .adm-chip { display: inline-block; font-size: 11px; padding: 0 6px; margin-right: 4px; border-radius: 2px; color: var(--tag-ink); }
    .adm-select { font: inherit; font-size: 13px; color: var(--ink); background: var(--bg); border: 1px solid var(--rule); border-radius: 3px; padding: 5px 7px; }
    .adm-dialog-body { overflow-y: auto; padding: 12px 16px; display: grid; gap: 10px; }
    .adm-dialog-body > label { display: flex; flex-direction: column; gap: 3px; font-size: 11px; color: var(--muted); }
    .adm-dialog-body textarea { font: inherit; font-size: 13px; color: var(--ink); background: transparent; border: 1px solid var(--rule); border-radius: 3px; padding: 6px 8px; resize: vertical; }
    .adm-dialog-body .adm-h3 { margin: 8px 0 0; }
    .adm-dialog-foot { display: flex; gap: 10px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--rule); }
    .adm-tags { display: grid; gap: 10px; justify-items: start; }
    .adm-tag-row { display: grid; grid-template-columns: 72px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 10px; border: 1px solid var(--rule); border-radius: 4px; width: 100%; }
    .adm-fields select { min-width: 0; }
    @media (max-width: 720px) {
      .adm-tl-item { grid-template-columns: 44px minmax(0, 1fr); }
      .adm-tl-item .adm-pick-thumb { width: 44px; }
      .adm-tl-month { display: none; }
      .adm-tl-ops { grid-column: 1 / -1; justify-content: flex-end; }
      .adm-tag-row { grid-template-columns: minmax(0, 1fr); }
    }
    .adm-pick-badge { flex: none; font-size: 10px; border: 1px solid var(--muted); border-radius: 10px; padding: 1px 8px; color: var(--muted); }
    .adm-preview { margin-top: 8px; }
    .adm-preview .featured-card { cursor: default; }
    .adm-empty { padding: 40px; text-align: center; color: var(--muted); border: 1px dashed var(--rule); }
    .adm-note { font-size: 12px; color: var(--muted); line-height: 1.8; }
    .adm-note code { font-size: 11px; background: var(--rule); padding: 1px 4px; border-radius: 2px; }
    .adm-form { display: grid; gap: 12px; max-width: 520px; }
    .adm-form label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
    .adm-form input { font: inherit; color: var(--ink); background: transparent; border: 1px solid var(--rule); border-radius: 3px; padding: 7px 9px; }
    @media (max-width: 720px) {
      .adm { grid-template-columns: minmax(0, 1fr); }
      .adm-side { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--rule); padding: 12px 0 0; }
      .adm-nav { display: flex; overflow-x: auto; }
      .adm-nav button { white-space: nowrap; width: auto; }
      .adm-nav button[aria-current="page"] { box-shadow: inset 0 -3px 0 var(--ink); }
      .adm-main { padding: 20px 16px 60px; }
      .adm-card { grid-template-columns: minmax(0, 1fr); }
      .adm-ops { flex-direction: row; flex-wrap: wrap; }
      .adm-fields { grid-template-columns: minmax(0, 1fr); }
    }
  </style>
</head>
<body>
<div class="adm">
  <aside class="adm-side">
    <div class="adm-brand">HP管理<small>shikine.github.io</small></div>
    <nav class="adm-nav" id="adm-nav"></nav>
  </aside>
  <main class="adm-main" id="adm-main"></main>
</div>

<script>
(function () {
  'use strict';

  /* ── 共通ユーティリティ ───────────────────────── */
  var $ = function (sel, root) { return (root || document).querySelector(sel); };
  function h(tag, attrs, children) {
    var el = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === 'on') Object.keys(attrs.on).forEach(function (ev) { el.addEventListener(ev, attrs.on[ev]); });
      else if (k === 'text') el.textContent = attrs[k];
      else if (attrs[k] !== false && attrs[k] != null) el.setAttribute(k, attrs[k] === true ? '' : attrs[k]);
    });
    (children || []).forEach(function (c) { if (c != null) el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return el;
  }
  function escAttr(s) { return String(s || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function escText(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function setStatus(el, msg, kind) { el.textContent = msg || ''; el.className = 'adm-status' + (kind ? ' ' + kind : ''); }

  /* ── 認証：GitHubトークンをパスワードで暗号化して admin/auth.json に置く ──
     PBKDF2(SHA-256) で鍵を作り AES-GCM で暗号化。復号した接続情報は
     sessionStorage にだけ置く（タブを閉じるとログアウト）。 */
  var AUTH_PATH = 'admin/auth.json';
  var SESSION_KEY = 'adm.session';
  var PBKDF2_ITER = 600000;
  var DEFAULT_CFG = { owner: 'shikine', repo: 'shikine.github.io', branch: 'main', token: '' };
  try { localStorage.removeItem('adm.gh.token'); } catch (e) {} // 旧方式の平文トークンを消す

  function b64(bytes) { var s = ''; bytes = new Uint8Array(bytes); for (var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]); return btoa(s); }
  function unb64(str) { return Uint8Array.from(atob(str), function (c) { return c.charCodeAt(0); }); }
  function deriveKey(password, salt, iter) {
    return crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']).then(function (base) {
      return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: salt, iterations: iter, hash: 'SHA-256' },
        base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
    });
  }
  var Auth = {
    encrypt: function (cfg, password) {
      var salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
      return deriveKey(password, salt, PBKDF2_ITER).then(function (key) {
        return crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, key, new TextEncoder().encode(JSON.stringify(cfg)));
      }).then(function (ct) {
        return JSON.stringify({ v: 1, kdf: 'PBKDF2-SHA256', iter: PBKDF2_ITER, salt: b64(salt), iv: b64(iv), data: b64(ct) }, null, 2) + '\n';
      });
    },
    decrypt: function (blob, password) {
      return deriveKey(password, unb64(blob.salt), blob.iter).then(function (key) {
        return crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(blob.iv) }, key, unb64(blob.data));
      }).then(function (pt) { return JSON.parse(new TextDecoder().decode(pt)); },
              function () { throw new Error('パスワードが違います'); });
    },
    /* 公開中の auth.json（無ければ null） */
    fetchBlob: function () {
      return fetch('auth.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) {
        if (r.status === 404) return null;
        if (!r.ok) throw new Error('auth.json を読めません (HTTP ' + r.status + ')');
        return r.json();
      });
    },
    session: function () { try { return JSON.parse(sessionStorage.getItem(SESSION_KEY) || 'null'); } catch (e) { return null; } },
    login: function (cfg) { try { sessionStorage.setItem(SESSION_KEY, JSON.stringify(cfg)); } catch (e) {} },
    logout: function () { try { sessionStorage.removeItem(SESSION_KEY); } catch (e) {} },
    /* 暗号化して GitHub にコミット（ログイン中の接続情報を使う） */
    save: function (cfg, password, message) {
      return Auth.encrypt(cfg, password).then(function (json) {
        return GH.req('GET', AUTH_PATH).then(function (j) { return j.sha; }, function (e) { if (e.status === 404) return null; throw e; })
          .then(function (sha) { return GH.putText(AUTH_PATH, json, sha, message); });
      });
    }
  };

  /* ── GitHub 連携（Contents API）────────────────── */
  var GH = {
    override: null, // 初期設定中だけ未保存の接続情報を使う
    cfg: function () { return GH.override || Auth.session() || DEFAULT_CFG; },
    ready: function () { return !!GH.cfg().token; },
    req: function (method, path, body) {
      var c = GH.cfg();
      var url = 'https://api.github.com/repos/' + c.owner + '/' + c.repo + '/contents/' +
                path.split('/').map(encodeURIComponent).join('/') +
                (method === 'GET' ? '?ref=' + encodeURIComponent(c.branch) + '&t=' + Date.now() : '');
      return fetch(url, {
        method: method,
        headers: { 'Authorization': 'Bearer ' + c.token, 'Accept': 'application/vnd.github+json' },
        body: body ? JSON.stringify(body) : undefined,
        cache: 'no-store'
      }).then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (j) {
          if (!r.ok) {
            var e = new Error((j && j.message) || ('HTTP ' + r.status));
            e.status = r.status; throw e;
          }
          return j;
        });
      });
    },
    /* テキストファイル取得（BOM も保持） */
    getText: function (path) {
      return GH.req('GET', path).then(function (j) {
        var bin = atob(j.content.replace(/\n/g, ''));
        var bytes = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        return { sha: j.sha, text: new TextDecoder('utf-8', { ignoreBOM: true }).decode(bytes) };
      });
    },
    putText: function (path, text, sha, message) {
      return GH.putBytes(path, new TextEncoder().encode(text), sha, message);
    },
    putBytes: function (path, bytes, sha, message) {
      var bin = '';
      for (var i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
      var body = { message: message, content: btoa(bin), branch: GH.cfg().branch };
      if (sha) body.sha = sha;
      return GH.req('PUT', path, body);
    }
  };

  /* ── 画像を縮小して JPEG 化 ─────────────────────── */
  function resizeImage(file, maxSide) {
    return new Promise(function (resolve, reject) {
      var img = new Image();
      img.onload = function () {
        var s = Math.min(1, maxSide / Math.max(img.width, img.height));
        var c = document.createElement('canvas');
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(img.src);
        c.toBlob(function (blob) {
          if (!blob) return reject(new Error('画像の変換に失敗しました'));
          blob.arrayBuffer().then(function (buf) { resolve({ blob: blob, bytes: new Uint8Array(buf) }); });
        }, 'image/jpeg', 0.86);
      };
      img.onerror = function () { reject(new Error('画像を読み込めませんでした')); };
      img.src = URL.createObjectURL(file);
    });
  }
  function slug(s) {
    return String(s || '').toLowerCase().replace(/\.[a-z0-9]+$/, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40) || 'kv';
  }

  /* ════════════════════════════════════════════════
     モジュール：キービジュアル（トップの注目作品カード）
     index.html の <!-- KV:START --> 〜 <!-- KV:END --> を書き換える
     ════════════════════════════════════════════════ */
  var KV_START = /<!-- KV:START[^>]*-->\n?/;
  var KV_END = /[ \t]*<!-- KV:END -->/;
  var KV_FIELDS = [
    ['titleJa', 'タイトル（日本語）'], ['titleEn', 'Title (English)'],
    ['catJa', 'カテゴリ（日本語）'],    ['catEn', 'Category (English)'],
    ['year', '年'],                    ['album', 'アルバムURL']
  ];

  function kvParse(html) {
    var s = html.search(KV_START), e = html.search(KV_END);
    if (s < 0 || e < 0 || e < s) throw new Error('index.html に KV:START / KV:END マーカーが見つかりません');
    var doc = new DOMParser().parseFromString('<div>' + html.slice(s, e) + '</div>', 'text/html');
    return Array.prototype.map.call(doc.querySelectorAll('.featured-card'), function (c) {
      return {
        img: c.getAttribute('data-img') || '',
        titleJa: c.getAttribute('data-title-ja') || '', titleEn: c.getAttribute('data-title-en') || '',
        catJa: c.getAttribute('data-cat-ja') || '',     catEn: c.getAttribute('data-cat-en') || '',
        year: c.getAttribute('data-year') || '',        album: c.getAttribute('data-album') || ''
      };
    });
  }

  function kvCardHtml(c, i) {
    var I = '      ';
    var note = (c.titleJa + ' ' + c.year).replace(/--+/g, '-').trim();
    var out = I + '<!-- card ' + (i + 1) + ': ' + note + ' -->\n' +
      I + '<div class="featured-card"\n' +
      I + '     data-img="' + escAttr(c.img) + '"\n' +
      I + '     data-title-ja="' + escAttr(c.titleJa) + '"\n' +
      I + '     data-title-en="' + escAttr(c.titleEn) + '"\n' +
      I + '     data-cat-ja="' + escAttr(c.catJa) + '" data-cat-en="' + escAttr(c.catEn) + '"\n' +
      I + '     data-year="' + escAttr(c.year) + '"\n' +
      I + '     data-album="' + escAttr(c.album) + '">\n';
    if (c.img) out += I + '  <img src="' + escAttr(c.img) + '" alt="' + escAttr(c.titleJa) + '" loading="lazy">\n';
    out += I + '  <div class="featured-card-info">\n' +
      I + '    <div class="featured-card-cat"><span class="t-ja">' + escText(c.catJa) + '</span><span class="t-en">' + escText(c.catEn) + '</span></div>\n' +
      I + '    <div class="featured-card-title"><span class="t-ja">' + escText(c.titleJa) + '</span><span class="t-en">' + escText(c.titleEn) + '</span></div>\n' +
      I + '    <div class="featured-card-year">' + escText(c.year) + '</div>\n' +
      I + '  </div>\n' +
      I + '</div>\n';
    return out;
  }

  function kvApply(html, cards) {
    var m = html.match(KV_START), s = m.index + m[0].length, e = html.search(KV_END);
    return html.slice(0, s) + cards.map(kvCardHtml).join('') + html.slice(e);
  }

  /* 年表（#timeline-view）から候補一覧を作る。サイト側の liToItem と同じ読み方 */
  var TL_TAGS = ['t-foto', 't-mv', 't-filmart', 't-spatial', 't-arch', 't-exhibition'];
  var TL_SEL = TL_TAGS.map(function (t) { return '.tag.' + t; }).join(', ');
  function bigImg(u) {
    // Google フォトの縮小URLはサイズ指定を書き換えると大きい画像になる
    return /googleusercontent\.com/.test(u) ? u.replace(/=w\d+-h\d+/, '=w1600-h1200') : u;
  }
  function sameImg(a, b) {
    var norm = function (u) { return String(u || '').replace(/=w\d+-h\d+.*$/, ''); };
    return !!a && norm(a) === norm(b);
  }
  function kvTimeline(html) {
    var doc = new DOMParser().parseFromString(html, 'text/html');
    var out = [];
    doc.querySelectorAll('#timeline-view .year-block').forEach(function (block) {
      var year = (block.querySelector('h3') || {}).textContent || '';
      block.querySelectorAll('.work-list > li').forEach(function (li) {
        var entry = li.querySelector('.entry') || li;
        var ja = entry.querySelector(':scope > .t-ja') || entry, en = entry.querySelector(':scope > .t-en');
        var jaTags = ja.querySelectorAll(TL_SEL), enTags = en ? en.querySelectorAll(TL_SEL) : [];

  /* ════════════════════════════════════════════════
     モジュール：作品年表
     index.html の <!-- TL:START --> 〜 <!-- TL:END --> を書き換え、
     あわい村の美術館用 works.json も同時に再生成する
     ════════════════════════════════════════════════ */
  var TL_START = /<!-- TL:START[^>]*-->\n/;
  var TL_END = /[ \t]*<!-- TL:END -->/;
  var TAG_TYPES = [
    ['t-foto', '写真アルバム'], ['t-mv', 'MV'], ['t-filmart', '映像美術'], ['t-spatial', '空間構成'],
    ['t-arch', '建築・構造'], ['t-exhibition', '展示'], ['t-movie', '動画・映画'], ['t-map', '地図'],
    ['t-gray', 'その他（グレー）'], ['t-ext', '外部リンク']
  ];

  /* 本文の簡易記法：[表示文字](URL) ⇔ <a href="URL" target="_blank">表示文字</a> */
  function nodesToMarkup(nodes) {
    var out = '';
    for (var i = 0; i < nodes.length; i++) {
      var n = nodes[i];
      if (n.nodeType === 3) out += n.nodeValue;
      else if (n.nodeType === 1 && n.tagName === 'A' && !n.className && n.getAttribute('target') === '_blank' &&
               n.attributes.length === 2 && n.children.length === 0) out += '[' + n.textContent + '](' + n.getAttribute('href') + ')';
      else return null; // 記法で表せない
    }
    return out;
  }
  function markupToHtml(s) {
    var re = /\[([^\]]*)\]\(([^)\s]+)\)/g, out = '', last = 0, m;
    while ((m = re.exec(s))) {
      out += escText(s.slice(last, m.index)) + '<a href="' + escAttr(m[2]) + '" target="_blank">' + escText(m[1]) + '</a>';
      last = re.lastIndex;
    }
    return out + escText(s.slice(last));
  }
  function markupToText(s) { return String(s || '').replace(/\[([^\]]*)\]\([^)\s]+\)/g, '$1'); }

  function tagHtml(t, lang) {
    return '<a href="' + escAttr(t.href) + '" target="_blank" class="tag ' + t.cls + '"' +
      (t.preview ? ' data-preview="' + escAttr(t.preview) + '"' : '') + '>' + escText(lang === 'ja' ? t.ja : t.en) + '</a>';
  }
  function langHtml(it, lang) {
    var body = lang === 'ja' ? it.bodyJa : it.bodyEn, collab = lang === 'ja' ? it.collabJa : it.collabEn;
    // 新規・編集時の英語本文はタグの後ろに半角スペースを入れる（既存の書き方に合わせる）
    if (lang === 'en' && it.tags.length && body && !/^[\s\[]/.test(body)) body = ' ' + body;
    var out = it.tags.map(function (t) { return tagHtml(t, lang); }).join('') + markupToHtml(body);
    if (collab) out += (/\s$/.test(body) || !body ? '' : ' ') + '<span class="collab">' + escText(collab) + '</span>';
    return out;
  }
  function liHtml(it) {
    if (it.orig != null) return it.orig;
    var ja = it.raw ? it.rawJa : langHtml(it, 'ja'), en = it.raw ? it.rawEn : langHtml(it, 'en');
    return '<li><span class="month">' + escText(it.month) + '</span><span class="entry"><span class="t-ja">' + ja +
      '</span><span class="t-en">' + en + '</span></span></li>';
  }

  /* li を編集用モデルにする。記法で正確に表せないものは raw（HTML直接編集）扱い */
  function tlParseLi(src) {
    var li = new DOMParser().parseFromString('<ul>' + src + '</ul>', 'text/html').querySelector('li');
    var month = li.querySelector(':scope > .month'), ja = li.querySelector('.entry > .t-ja'), en = li.querySelector('.entry > .t-en');
    var it = { orig: src, month: month ? month.textContent : '', raw: false, tags: [], bodyJa: '', bodyEn: '', collabJa: '', collabEn: '' };
    if (!ja || !en) { it.raw = true; it.rawJa = li.innerHTML; it.rawEn = ''; return it; }
    function split(span) {
      var nodes = Array.prototype.slice.call(span.childNodes), tags = [], collab = '';
      while (nodes.length && nodes[0].nodeType === 1 && nodes[0].tagName === 'A' && nodes[0].classList.contains('tag')) tags.push(nodes.shift());
      var last = nodes[nodes.length - 1];
      if (last && last.nodeType === 1 && last.tagName === 'SPAN' && last.className === 'collab' && !last.children.length) { collab = last.textContent; nodes.pop(); }
      return { tags: tags, body: nodesToMarkup(nodes), collab: collab };
    }
    var a = split(ja), b = split(en);
    var ok = a.body != null && b.body != null && a.tags.length === b.tags.length;
    if (ok) {
      it.tags = a.tags.map(function (t, k) {
        var e = b.tags[k];
        if (t.getAttribute('href') !== e.getAttribute('href') || t.className !== e.className ||
            (t.getAttribute('data-preview') || '') !== (e.getAttribute('data-preview') || '') || t.children.length || e.children.length) ok = false;
        return { cls: (t.className.split(/\s+/).filter(function (c) { return c !== 'tag'; })[0]) || 't-gray',
                 href: t.getAttribute('href') || '', preview: t.getAttribute('data-preview') || '', ja: t.textContent, en: e.textContent };
      });
      it.bodyJa = a.body; it.bodyEn = b.body; it.collabJa = a.collab; it.collabEn = b.collab;
    }
    // 組み立て直した HTML が DOM として元と一致するか確認
    if (ok) {
      var probe = Object.assign({}, it, { orig: null });
      var re = new DOMParser().parseFromString('<ul>' + liHtml(probe) + '</ul>', 'text/html').querySelector('li');
      if (re.innerHTML !== li.innerHTML) ok = false;
    }
    if (!ok) { it.raw = true; it.tags = []; it.rawJa = ja.innerHTML; it.rawEn = en.innerHTML; }
    return it;
  }

  function tlParse(html) {
    var s = html.search(TL_START), e = html.search(TL_END);
    if (s < 0 || e < 0 || e < s) throw new Error('index.html に TL:START / TL:END マーカーが見つかりません');
    var region = html.slice(s, e), years = [];
    var re = /<div class="year-block">\s*<h3>([^<]*)<\/h3>\s*<ul class="work-list">([\s\S]*?)<\/ul>\s*<\/div>/g, m;
    while ((m = re.exec(region))) {
      var items = (m[2].match(/<li>[\s\S]*?<\/li>/g) || []).map(tlParseLi);
      years.push({ year: m[1].trim(), items: items });
    }
    if (!years.length) throw new Error('年表を読み取れませんでした');
    return years;
  }
  function tlRegionHtml(years) {
    return years.map(function (y) {
      return '    <div class="year-block">\n      <h3>' + escText(y.year) + '</h3>\n      <ul class="work-list">\n' +
        y.items.map(function (it) { return '        ' + liHtml(it) + '\n'; }).join('') +
        '      </ul>\n    </div>\n';
    }).join('\n');
  }
  function tlApply(html, years) {
    var m = html.match(TL_START), s = m.index + m[0].length, e = html.search(TL_END);
    return html.slice(0, s) + tlRegionHtml(years) + html.slice(e);
  }
  /* sync-works.ps1 と同じ形の works.json を作る */
  function worksJson(html) {
    var doc = new DOMParser().parseFromString(html, 'text/html'), years = [];
    doc.querySelectorAll('#timeline-view .year-block').forEach(function (block) {
      var y = (block.querySelector('h3') || {}).textContent || '';
      if (!/^\d{4}$/.test(y.trim())) return;
      var items = [];
      block.querySelectorAll('.work-list > li').forEach(function (li) {
        var m = ((li.querySelector('.month') || {}).textContent || '').trim();
        var ja = li.querySelector('.entry > .t-ja') || li;
        var c = Array.prototype.map.call(ja.querySelectorAll('a.tag'), function (a) { return a.textContent.trim(); }).join('・');
        var clone = ja.cloneNode(true);
        clone.querySelectorAll('a.tag').forEach(function (a) { a.remove(); });
        var t = clone.textContent.replace(/\s+/g, ' ').trim();
        if (m || c || t) items.push({ m: m, c: c, t: t });
      });
      years.push({ y: y.trim(), items: items });
    });
    return JSON.stringify(years, null, 4) + '\n';
  }

  var tlModule = {
    id: 'works',
    label: '作品年表',
    state: null, // { years, dirty, staged: [{tag, name, bytes, url}] }
    render: function (main) {
      var self = this;
      main.appendChild(h('h2', { text: '作品年表' }));
      main.appendChild(h('p', { class: 'adm-lead', text: 'Works の年代順リスト。保存するとジャンル別表示・あわい村の美術館（works.json）にも反映されます。' }));
      var status = h('span', { class: 'adm-status' });

    /* 編集ダイアログ。yi=null は年未指定の新規、ii=null は新規 */

      function drawTags() {
        tagsBox.innerHTML = '';

            t.ja = jaIn.value;

          var prevIn = h('input', { type: 'text', value: t.preview, placeholder: '/thumnail/xxx.jpg または画像URL', on: { change: function () {

            var f = file.files[0]; if (!f) return;
            resizeImage(f, 1600).then(function (r) {
              var base = slug(markupToText(it.bodyEn) || f.name) + '-' + (st.years[+yearSel.value] || {}).year;

          tagsBox.appendChild(h('div', { class: 'adm-tag-row' }, [
            h('span', { class: 'adm-pick-thumb' }, [thumbSrc ? h('img', { src: thumbSrc, alt: '' }) : '画像なし']),
            h('div', { class: 'adm-fields' }, [
              h('label', null, ['種類（色）', typeSel]),
              h('label', null, ['リンク先URL', hrefIn]),
              h('label', null, ['ラベル（日本語）', jaIn]),
              h('label', null, ['Label (English)', enIn]),
              h('label', { class: 'wide' }, ['プレビュー画像（クリック時に表示）', h('span', { class: 'adm-img-row' }, [
                prevIn, h('button', { class: 'adm-btn small', type: 'button', text: 'アップロード', on: { click: function () { file.click(); } } }), file

        h('div', { class: 'adm-h3', text: '本文' }),
        h('label', null, ['日本語　例: ヌトミック『波のような人』＠[愛知県芸術劇場](https://…) 小ホール', bodyJa]),
        h('label', null, ['English', bodyEn]),
        h('div', { class: 'adm-fields' }, [h('label', null, ['協働者（日本語側）', collabJa]), h('label', null, ['協働者（English）', collabEn])]),
        h('p', { class: 'adm-note', text: 'リンクは [表示する文字](URL) と書きます。' })
      ];

        h('div', { class: 'adm-dialog-head' }, [h('strong', { text: isNew ? '項目を追加' : '項目を編集' }),

    save: function (status, btn) {
      var self = this, st = this.state;
      btn.disabled = true;
      // 年表に残っているタグのアップロード待ち画像だけ送る
      var live = [];
      st.years.forEach(function (y) { y.items.forEach(function (it) { it.tags.forEach(function (t) { live.push(t); }); }); });
      var staged = st.staged.filter(function (s) { return live.indexOf(s.tag) >= 0 && s.tag.preview === '/' + s.name; });
      var chain = Promise.resolve();
      staged.forEach(function (s, n) {
        chain = chain.then(function () {
          setStatus(status, '画像をアップロード中… (' + (n + 1) + '/' + staged.length + ')');
          return GH.putBytes(s.name, s.bytes, null, '年表の画像を追加: ' + s.name.split('/').pop());
        });
      });
      var html;
      chain.then(function () {
        setStatus(status, 'index.html を保存中…');
        return GH.getText('index.html');
      }).then(function (f) {
        html = tlApply(f.text, st.years);
        if (html === f.text) return;
        return GH.putText('index.html', html, f.sha, '作品年表を更新');
      }).then(function () {
        setStatus(status, 'works.json を更新中…');
        var json = worksJson(html);
        return GH.getText('works.json').then(function (f) {
          var same = f.text === json;
          try { same = same || JSON.stringify(JSON.parse(f.text)) === JSON.stringify(JSON.parse(json)); } catch (e) {}
          if (same) return; // 書式だけの差分ではコミットしない
          return GH.putText('works.json', json, f.sha, 'works.json を年表から再生成');
        });
      }).then(function () {
        st.staged = []; st.dirty = false;
        st.years = tlParse(html);
        kvModule.state = null; // キービジュアルの候補一覧も最新に
        setStatus(status, '保存しました。1〜2分で公開サイトに反映されます。', 'ok');
        self.draw();
      }).catch(function (e) {
        btn.disabled = false;
        setStatus(status, '保存失敗: ' + e.message + (e.status === 409 ? '（他で更新されています。再読み込みしてください）' : ''), 'err');
      });
    }
  };

  /* ── トークンの作り方（初期設定・設定画面で共用）── */
  function tokenHelp() {
    var note = h('div', { class: 'adm-note' });
    note.innerHTML =
      '1. GitHub → Settings → Developer settings → <b>Fine-grained tokens</b> → Generate new token<br>' +
      '2. Repository access: <code>Only select repositories</code> → <code>shikine.github.io</code><br>' +
      '3. Permissions → Repository permissions → <b>Contents: Read and write</b>（他は不要）<br>' +
      '4. 期限が切れたら作り直し、「設定」→「トークンを更新」で貼り直す';
    return note;
  }
  function field(label, type, value, extra) {
    var inp = h('input', Object.assign({ type: type, value: value || '', autocomplete: type === 'password' ? 'new-password' : 'off' }, extra || {}));
    return { el: h('label', null, [label, inp]), input: inp };
  }
  function checkPassword(p1, p2) {
    if (p1.length < 12) return 'パスワードは12文字以上にしてください';
    if (p1 !== p2) return 'パスワード（確認）が一致しません';
    return '';
  }

  /* ════════════════════════════════════════════════
     モジュール：設定（パスワード・トークン・ログアウト）
     ════════════════════════════════════════════════ */
  var settingsModule = {
    id: 'settings',
    label: '設定',
    render: function (main) {
      var c = GH.cfg();
      main.appendChild(h('h2', { text: '設定' }));
      main.appendChild(h('p', { class: 'adm-lead', text: '接続先: ' + c.owner + '/' + c.repo + '（' + c.branch + '）' }));

      // パスワード変更
      main.appendChild(h('div', { class: 'adm-h3', text: 'パスワードを変更' }));
      var pw1 = field('新しいパスワード（12文字以上）', 'password'), pw2 = field('新しいパスワード（確認）', 'password');
      var st1 = h('span', { class: 'adm-status' });
      main.appendChild(h('div', { class: 'adm-form' }, [pw1.el, pw2.el]));
      main.appendChild(h('div', { class: 'adm-bar', style: 'margin-top:12px' }, [
        h('button', { class: 'adm-btn primary', text: '変更する', on: { click: function (ev) {
          var err = checkPassword(pw1.input.value, pw2.input.value);
          if (err) return setStatus(st1, err, 'err');
          ev.target.disabled = true; setStatus(st1, '暗号化して保存中…');
          Auth.save(GH.cfg(), pw1.input.value, '管理画面のパスワードを変更').then(function () {
            pw1.input.value = pw2.input.value = '';
            setStatus(st1, '変更しました（公開サイトへの反映に1〜2分かかります）', 'ok');
          }).catch(function (e) { setStatus(st1, '失敗: ' + e.message, 'err'); })
            .then(function () { ev.target.disabled = false; });
        } } }),
        st1
      ]));

      // トークン更新
      main.appendChild(h('div', { class: 'adm-h3', text: 'トークンを更新' }));
      var tk = field('新しいアクセストークン', 'password', '', { placeholder: 'github_pat_…' });
      var pw3 = field('現在のパスワード（再暗号化に使います）', 'password');
      var st2 = h('span', { class: 'adm-status' });
      main.appendChild(h('div', { class: 'adm-form' }, [tk.el, pw3.el]));
      main.appendChild(h('div', { class: 'adm-bar', style: 'margin-top:12px' }, [
        h('button', { class: 'adm-btn primary', text: '更新する', on: { click: function (ev) {
          var token = tk.input.value.trim(), pw = pw3.input.value;
          if (!token || !pw) return setStatus(st2, 'トークンとパスワードを入力してください', 'err');
          ev.target.disabled = true; setStatus(st2, '確認中…');
          var cur = GH.cfg();
          Auth.fetchBlob().then(function (blob) {
            // 現在のパスワードが正しいか確認してから差し替える
            return blob ? Auth.decrypt(blob, pw) : null;
          }).then(function () {
            var next = Object.assign({}, cur, { token: token });
            GH.override = next;
            return GH.getText('index.html').then(function () { return Auth.save(next, pw, '管理画面のトークンを更新'); })
              .then(function () { Auth.login(next); });
          }).then(function () {
            tk.input.value = pw3.input.value = '';
            setStatus(st2, '更新しました', 'ok');
          }).catch(function (e) { setStatus(st2, '失敗: ' + e.message, 'err'); })
            .then(function () { GH.override = null; ev.target.disabled = false; });
        } } }),
        st2
      ]));
      main.appendChild(tokenHelp());

      main.appendChild(h('div', { class: 'adm-h3', text: 'ログアウト' }));
      main.appendChild(h('button', { class: 'adm-btn', text: 'ログアウト', on: { click: function () { App.logout(); } } }));
    }
  };

  /* ════════════════════════════════════════════════
     モジュール登録
     新しい管理項目を追加するときは { id, label, render(main) } を
     この配列に足すだけ。soon: true でメニューに「準備中」表示。
     ════════════════════════════════════════════════ */
  var MODULES = [
    kvModule,
    tlModule,
    { id: 'news',    label: 'お知らせ',   soon: true },
    settingsModule
  ];

  var App = {
    current: null,
    drawNav: function () {
      var nav = $('#adm-nav'); nav.innerHTML = '';
      MODULES.forEach(function (m) {
        nav.appendChild(h('button', {
          'aria-current': m.id === App.current ? 'page' : false,
          disabled: !!m.soon,
          on: { click: function () { App.go(m.id); } }
        }, [m.label, m.soon ? h('span', { class: 'soon', text: '準備中' }) : null]));
      });
    },
    go: function (id) {
      if (!GH.ready()) return App.gate();
      var m = MODULES.filter(function (x) { return x.id === id && !x.soon; })[0] || MODULES[0];
      App.current = m.id;
      if (location.hash !== '#' + m.id) history.replaceState(null, '', '#' + m.id);
      var main = $('#adm-main'); main.innerHTML = '';
      m.render(main);
      App.drawNav();
    },
    logout: function () {
      if (MODULES.some(function (m) { return m.leaveGuard && m.leaveGuard(); }) && !confirm('未保存の変更があります。ログアウトしますか？')) return;
      Auth.logout(); kvModule.state = null; App.gate();
    },
    /* ログイン前の画面：auth.json があればログイン、無ければ初期設定 */
    gate: function () {
      $('#adm-nav').innerHTML = '';
      var main = $('#adm-main'); main.innerHTML = '';
      var status = h('span', { class: 'adm-status', text: '確認中…' });
      main.appendChild(status);
      Auth.fetchBlob().then(function (blob) {
        main.innerHTML = '';
        if (blob) App.loginForm(main, blob); else App.setupForm(main);
      }).catch(function (e) { setStatus(status, e.message, 'err'); });
    },
    loginForm: function (main, blob) {
      main.appendChild(h('h2', { text: 'ログイン' }));
      main.appendChild(h('p', { class: 'adm-lead', text: '管理画面のパスワードを入力してください。' }));
      var pw = field('パスワード', 'password', '', { autocomplete: 'current-password' });
      var status = h('span', { class: 'adm-status' });
      var btn = h('button', { class: 'adm-btn primary', type: 'submit', text: 'ログイン' });
      main.appendChild(h('form', { class: 'adm-form', on: { submit: function (ev) {
        ev.preventDefault();
        btn.disabled = true; setStatus(status, '確認中…');
        Auth.decrypt(blob, pw.input.value).then(function (cfg) {
          Auth.login(cfg);
          App.go(location.hash.slice(1) || 'keyvisual');
        }).catch(function (e) { btn.disabled = false; pw.input.value = ''; setStatus(status, e.message, 'err'); });
      } } }, [pw.el, h('div', { class: 'adm-bar' }, [btn, status])]));
      pw.input.focus();
    },
    setupForm: function (main) {
      main.appendChild(h('h2', { text: '初期設定' }));
      main.appendChild(h('p', { class: 'adm-lead', text: 'GitHubトークンを管理画面のパスワードで暗号化して保存します。以後はパスワードだけでログインできます。' }));
      var tk = field('GitHubアクセストークン', 'password', '', { placeholder: 'github_pat_…' });
      var pw1 = field('管理画面のパスワード（12文字以上）', 'password'), pw2 = field('パスワード（確認）', 'password');
      var status = h('span', { class: 'adm-status' });
      var btn = h('button', { class: 'adm-btn primary', type: 'submit', text: '設定して始める' });
      main.appendChild(h('form', { class: 'adm-form', on: { submit: function (ev) {
        ev.preventDefault();
        var err = checkPassword(pw1.input.value, pw2.input.value);
        if (!tk.input.value.trim()) err = 'トークンを入力してください';
        if (err) return setStatus(status, err, 'err');
        var cfg = Object.assign({}, DEFAULT_CFG, { token: tk.input.value.trim() });
        btn.disabled = true; setStatus(status, 'トークンを確認中…');
        GH.override = cfg;
        GH.getText('index.html').then(function () {
          setStatus(status, '暗号化して保存中…');
          return Auth.save(cfg, pw1.input.value, '管理画面のパスワードを設定');
        }).then(function () {
          Auth.login(cfg);
          GH.override = null;
          App.go('keyvisual');
        }).catch(function (e) {
          GH.override = null; btn.disabled = false;
          setStatus(status, '失敗: ' + e.message, 'err');
        });
      } } }, [tk.el, pw1.el, pw2.el, h('div', { class: 'adm-bar' }, [btn, status])]));
      main.appendChild(h('div', { class: 'adm-h3', text: 'トークンの作り方' }));
      main.appendChild(tokenHelp());
    }
  };

  window.addEventListener('beforeunload', function (e) {
    if (MODULES.some(function (m) { return m.leaveGuard && m.leaveGuard(); })) { e.preventDefault(); e.returnValue = ''; }
  });
  window.addEventListener('hashchange', function () { if (GH.ready()) App.go(location.hash.slice(1)); });
  if (GH.ready()) App.go(location.hash.slice(1) || 'keyvisual'); else App.gate();
})();
</script>
</body>
</html>
